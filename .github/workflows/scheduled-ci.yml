name: Scheduled CI
on:
  schedule: [{cron: '30 2 * * 1-5'}]
  workflow_dispatch:
concurrency: {group: scheduled-ci, cancel-in-progress: true}
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.11.0', cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:all
      - run: npm run build
